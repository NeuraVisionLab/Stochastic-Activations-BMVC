name: Tests and package validation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test extras
        run: python -m pip install -e ".[dev,all]"
      - name: Check syntax
        run: python -m compileall -q stochact
      - name: Run tests and coverage
        run: python -m pytest -q --cov=stochact --cov-report=term --cov-fail-under=80
      - name: Critical Ruff checks
        run: python -m ruff check --select E4,E7,E9 stochact tests examples

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel and import it away from source checkout
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c 'import stochact; from stochact import StochasticModel; from torch import nn; m=StochasticModel(nn.Sequential(nn.Linear(4, 4), nn.ReLU())); assert m.conversion_report.replaced == 1; print(stochact.__version__)'
